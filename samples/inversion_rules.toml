[settings]
trace = "traces/inversion_spike_clean.txt"
target_env = "qemu"
margin_pct = 10

[logical_checks]
priority_inversion = true
semaphore_locks = true
forbid_blocking_ipc = ["sensor_high"]

[[timing_rule]]
name = "sensor_high response time"
thread = "sensor_high"
deadline_ms = 10.0
max_sched_latency_ms = 2.0