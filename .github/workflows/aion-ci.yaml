name: Aion Real-Time Timing & RCA CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  verify-traces-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Aion and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run automated pytest suite
        run: pytest -v

      - name: Run end-to-end QNX 8.0 trace verification matrix
        run: |
          chmod +x scripts/run_all_demos.sh
          ./scripts/run_all_demos.sh

      - name: Generate HTML & JSON reports for Semaphore Priority Inversion demo
        run: |
          # Broken demo exits 1 by design; capture its HTML report artifact
          aion check --config samples/semaphore_rules.toml --format html --output semaphore_report.html traces/semaphore_demo.txt || true
          test -s semaphore_report.html

      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aion-html-report
          path: semaphore_report.html