[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-qnx"
version = "0.1.0"
description = "Automated real-time timing verification and causal root-cause analysis (RCA) for QNX Neutrino 8.0 kernel traces"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Rakshit Chaturvedi"}
]
dependencies = [
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
aion = "aion.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]