[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aion"
version = "0.1.0"
description = "Automated real-time timing verification for QNX 8.0"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "tomli>=2.0.0; python_version<'3.11'",
]

[project.scripts]
aion = "aion.cli:main"